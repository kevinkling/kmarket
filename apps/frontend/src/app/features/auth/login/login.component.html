<div class="login-page">
  <div class="login-card km-card">
    <div class="brand">
      <img src="icons/logo.svg" alt="KMarket" width="56" height="56">
      <h1 class="font-serif">KMarket</h1>
      <p>Entrá con tu cuenta familiar para sincronizar la despensa.</p>
      <div class="status-row">
        <app-backend-status></app-backend-status>
      </div>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <label class="field">
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="username" placeholder="familia@ejemplo.com">
      </label>

      <label class="field">
        <span>Contraseña</span>
        <input type="password" formControlName="password" autocomplete="current-password">
      </label>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button
        mat-flat-button
        class="km-btn-primary full-width"
        type="submit"
        [disabled]="loginForm.invalid || submitting()"
      >
        <mat-icon>login</mat-icon>
        {{ submitting() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
